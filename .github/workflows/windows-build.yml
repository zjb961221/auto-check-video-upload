name: Build Windows desktop app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        shell: pwsh
        run: ./build.ps1
      - name: Capture desktop previews
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools/capture_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClientOpsTool-Windows-x64
          path: |
            ui-previews/*.bmp
            dist/ClientOpsTool.exe
            dist/workflows.json
            dist/workflows.example.json
            dist/WORKFLOWS.md
            dist/queries.json
            dist/api_requests.json
            dist/updates.json
            dist/updates.example.json
            dist/deletes.example.json
            dist/DELETES.md
            dist/database_profiles.json
            dist/database_profiles.example.json
            dist/DATABASE_PROFILES.md
            dist/api_mines.example.json
            dist/API_MINES.md
            dist/PARAMETERS.md
            dist/README.md
            dist/site_profiles.json
            dist/site_profiles.example.json
            dist/ops_settings.json
            dist/verification.example.json
            dist/OPERATIONS.md
            dist/upgrade.ps1
          if-no-files-found: error
